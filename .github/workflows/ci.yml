name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the only third party import, voluptuous
        run: python -m pip install voluptuous

      - name: Byte compile
        run: python -m compileall -q custom_components/kmf_series

      - name: Tests
        run: |
          python tests/test_parser.py
          (cd tests && python test_client.py)
          (cd tests && python test_integration.py)
